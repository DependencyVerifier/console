# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Attribute routes, one import per bounded context (src/<Context>/UI/Controller).
# The route name prefix is "<context>_"; each context lists its route names in a RouteCollection enum.

shared:
    resource:
        path: ../src/Shared/UI/Controller/
        namespace: Shared\UI\Controller
    type: attribute
    name_prefix: shared_

identity:
    resource:
        path: ../src/Identity/UI/Controller/
        namespace: Identity\UI\Controller
    type: attribute
    name_prefix: identity_

organization:
    resource:
        path: ../src/Organization/UI/Controller/
        namespace: Organization\UI\Controller
    type: attribute
    name_prefix: organization_

fleet:
    resource:
        path: ../src/Fleet/UI/Controller/
        namespace: Fleet\UI\Controller
    type: attribute
    name_prefix: fleet_

inventory:
    resource:
        path: ../src/Inventory/UI/Controller/
        namespace: Inventory\UI\Controller
    type: attribute
    name_prefix: inventory_

vulnerability:
    resource:
        path: ../src/Vulnerability/UI/Controller/
        namespace: Vulnerability\UI\Controller
    type: attribute
    name_prefix: vulnerability_

exposure:
    resource:
        path: ../src/Exposure/UI/Controller/
        namespace: Exposure\UI\Controller
    type: attribute
    name_prefix: exposure_

notification:
    resource:
        path: ../src/Notification/UI/Controller/
        namespace: Notification\UI\Controller
    type: attribute
    name_prefix: notification_

audit:
    resource:
        path: ../src/Audit/UI/Controller/
        namespace: Audit\UI\Controller
    type: attribute
    name_prefix: audit_
