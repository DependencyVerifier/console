# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# One resource per bounded context (src/<Context>/{Domain,Application,Infrastructure,UI}).
# Domain models (entities, value objects) are never services.

parameters:
    agent_releases_default_dir: '%kernel.project_dir%/var/agent-releases'
    agent_releases_default_url: 'https://api.github.com/repos/DependencyVerifier/agent/releases/latest'
    # The minisign public key of the project's releases (cadrage §6, key id EBDDB456A4BF3356): a release of the agent is
    # served only if its checksums carry its signature. An instance may override it (a fork), never empty it silently.
    env(AGENT_RELEASE_PUBKEY): 'RWRWM7+kVrTd63TMnDIUOLjb78MC3QJTImbW3Gi/8ooaxK7iF2tC/ZSz'
    # A webhook never reaches a private network, unless set to 1 (dev, a local receiver; the tests).
    env(NOTIFICATION_WEBHOOK_ALLOW_PRIVATE): '0'
    # The console key the agents move to during a rotation (make console-key-rotate): empty outside a rotation.
    env(APP_AGENT_SIGNING_KEY_NEXT): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # CQRS: handlers implement a marker interface and are routed to their bus here,
    # so the Application layer does not depend on Messenger.
    _instanceof:
        Shared\Application\Bus\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        Shared\Application\Bus\QueryHandler:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        Shared\Application\Bus\EventHandler:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    # Locks of the rate limiters and of ExclusiveSection: PostgreSQL advisory locks on the "rate_limiter"
    # connection (no fourth connection per worker).
    app.rate_limiter.lock_store:
        class: Symfony\Component\Lock\Store\DoctrineDbalPostgreSqlStore
        arguments: ['@doctrine.dbal.rate_limiter_connection']
    app.rate_limiter.lock_factory:
        class: Symfony\Component\Lock\LockFactory
        arguments: ['@app.rate_limiter.lock_store']

    # Sessions in PostgreSQL through a native PDO DSN (Identity\Infrastructure\Session).
    app.session_handler:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        factory: ['Identity\Infrastructure\Session\DatabaseSessionHandlerFactory', 'create']
        arguments: ['%env(DATABASE_URL)%']

    # The security token's user (also during the second factor), else cli / anonymous.
    Shared\Application\Security\CurrentActor: '@Identity\Infrastructure\Security\AuthenticatedCurrentActor'
    # Instance permissions from Identity, team and project permissions from Organization's memberships.
    Shared\Application\Authorization\InstancePermissions: '@Identity\Infrastructure\Security\InstancePermissionChecker'
    Shared\Application\Contract\Identity\AccountProvisioning: '@Identity\Application\Account\AccountProvisioner'
    Shared\Application\Authorization\PermissionChecker: '@Organization\Infrastructure\Security\OrganizationPermissionChecker'

    Shared\:
        resource: '../src/Shared/'
        exclude:
            - '../src/Shared/Kernel.php'
            - '../src/Shared/Domain/'

    Identity\:
        resource: '../src/Identity/'
        exclude: '../src/Identity/Domain/Model/'

    Organization\:
        resource: '../src/Organization/'
        exclude: '../src/Organization/Domain/Model/'

    Fleet\:
        resource: '../src/Fleet/'
        exclude: '../src/Fleet/Domain/Model/'

    Inventory\:
        resource: '../src/Inventory/'
        exclude: '../src/Inventory/Domain/Model/'

    Vulnerability\:
        resource: '../src/Vulnerability/'
        exclude: '../src/Vulnerability/Domain/Model/'

    Exposure\:
        resource: '../src/Exposure/'
        exclude: '../src/Exposure/Domain/Model/'

    Notification\:
        resource: '../src/Notification/'
        exclude: '../src/Notification/Domain/Model/'

    Audit\:
        resource: '../src/Audit/'
        exclude: '../src/Audit/Domain/Model/'

    # Explicit definitions after the resources (a resource registered later would replace them).
    # AttemptThrottle adapter: one limiter per Shared\Application\Security\ThrottleName.
    Shared\Infrastructure\RateLimiting\SymfonyRateLimiterThrottle:
        arguments:
            $limiters: !service_locator
                second_factor_short: '@limiter.second_factor_short'
                second_factor_long: '@limiter.second_factor_long'
                second_factor_ip: '@limiter.second_factor_ip'
                second_factor_alert: '@limiter.second_factor_alert'
                password_reset_email: '@limiter.password_reset_email'
                password_reset_ip: '@limiter.password_reset_ip'
                email_code_resend: '@limiter.email_code_resend'
                invitation_resend: '@limiter.invitation_resend'
                invitation_resend_team: '@limiter.invitation_resend_team'
                agent_requests: '@limiter.agent_requests'
                agent_enrollment_ip: '@limiter.agent_enrollment_ip'
                passkey_login_ip: '@limiter.passkey_login_ip'

when@test:
    parameters:
        agent_releases_default_dir: '%kernel.cache_dir%/agent-releases'
