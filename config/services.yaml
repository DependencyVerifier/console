# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# One resource per bounded context (src/<Context>/{Domain,Application,Infrastructure,UI}).
# Domain models (entities, value objects) are never services.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # CQRS: handlers implement a marker interface and are routed to their bus here,
    # so the Application layer does not depend on Messenger.
    _instanceof:
        Shared\Application\Bus\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        Shared\Application\Bus\QueryHandler:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        Shared\Application\Bus\EventHandler:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    Shared\:
        resource: '../src/Shared/'
        exclude:
            - '../src/Shared/Kernel.php'
            - '../src/Shared/Domain/'

    Identity\:
        resource: '../src/Identity/'
        exclude: '../src/Identity/Domain/Model/'

    Organization\:
        resource: '../src/Organization/'
        exclude: '../src/Organization/Domain/Model/'

    Fleet\:
        resource: '../src/Fleet/'
        exclude: '../src/Fleet/Domain/Model/'

    Inventory\:
        resource: '../src/Inventory/'
        exclude: '../src/Inventory/Domain/Model/'

    Vulnerability\:
        resource: '../src/Vulnerability/'
        exclude: '../src/Vulnerability/Domain/Model/'

    Exposure\:
        resource: '../src/Exposure/'
        exclude: '../src/Exposure/Domain/Model/'

    Notification\:
        resource: '../src/Notification/'
        exclude: '../src/Notification/Domain/Model/'

    Audit\:
        resource: '../src/Audit/'
        exclude: '../src/Audit/Domain/Model/'
