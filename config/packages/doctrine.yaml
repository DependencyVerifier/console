doctrine:
    dbal:
        default_connection: default
        connections:
            # Runtime role (depverify_app) for the web workers. CLI owner commands (migrations, audit partitions)
            # swap DATABASE_URL for the owner's one inside the container (see Makefile, OWNER_CONSOLE).
            default:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
                # Tables written in raw SQL migrations, outside the ORM mapping: never diffed (nor dropped).
                schema_filter: '~^(?!audit\.|rate_limiter_state$)~'
            # Rate limiter states and advisory locks: same runtime role, autocommit, outside any command
            # transaction (a rollback never gives a consumed token back). Session timeouts are set at connect
            # time by Shared\Infrastructure\Doctrine\SessionTimeoutsDriverMiddleware.
            rate_limiter:
                url: '%env(resolve:DATABASE_URL)%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # One mapping per bounded context: aggregates and entities live in src/<Context>/Domain/Model.
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'Identity\Domain\Model'
                alias: Identity
            Organization:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organization/Domain/Model'
                prefix: 'Organization\Domain\Model'
                alias: Organization
            Fleet:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Fleet/Domain/Model'
                prefix: 'Fleet\Domain\Model'
                alias: Fleet
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Domain/Model'
                prefix: 'Inventory\Domain\Model'
                alias: Inventory
            Vulnerability:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Vulnerability/Domain/Model'
                prefix: 'Vulnerability\Domain\Model'
                alias: Vulnerability
            Exposure:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Exposure/Domain/Model'
                prefix: 'Exposure\Domain\Model'
                alias: Exposure
            Notification:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notification/Domain/Model'
                prefix: 'Notification\Domain\Model'
                alias: Notification
            Audit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Audit/Domain/Model'
                prefix: 'Audit\Domain\Model'
                alias: Audit

when@test:
    doctrine:
        dbal:
            connections:
                # "TEST_TOKEN" is typically set by ParaTest
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                rate_limiter:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

        orm:
            mappings:
                TestFixtures:
                    type: attribute
                    is_bundle: false
                    dir: '%kernel.project_dir%/tests/Fixtures/Doctrine'
                    prefix: 'Tests\Fixtures\Doctrine'
                    alias: TestFixtures

    # Every test runs in a transaction rolled back afterwards (default connection only). Tests that need
    # committed data across connections (concurrency, lock timeouts, privileges) opt out explicitly.
    dama_doctrine_test:
        enable_static_connection:
            default: true
            rate_limiter: false
        enable_static_meta_data_cache: true
        enable_static_query_cache: true

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
