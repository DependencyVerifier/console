doctrine_migrations:
    migrations_paths:
        # Namespace distinct from the bounded contexts: migration classes are never autoloaded as services.
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    # One sub-directory per year (migrations/2026/Version20261108….php); the namespace stays DoctrineMigrations.
    organize_migrations: BY_YEAR
    enable_profiler: false
