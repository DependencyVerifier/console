# Every limiter of the application. Storage: rate_limiter_state on the dedicated "rate_limiter" connection, fail-closed
# (Shared\Infrastructure\RateLimiting\DbalRateLimiterStorage); locks: PostgreSQL advisory locks on the same connection.
# The Application layer uses them through Shared\Application\Security\AttemptThrottle, never directly.
framework:
    rate_limiter:
        second_factor_short: &limiter
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            storage_service: Shared\Infrastructure\RateLimiting\DbalRateLimiterStorage
            lock_factory: app.rate_limiter.lock_factory
        second_factor_ip:
            <<: *limiter
        second_factor_long:
            <<: *limiter
            limit: 20
            interval: '24 hours'
        second_factor_alert:
            <<: *limiter
            limit: 1
            interval: '24 hours'
        password_reset_email:
            <<: *limiter
            limit: 3
            interval: '1 hour'
        password_reset_ip:
            <<: *limiter
            limit: 20
            interval: '1 hour'
        email_code_resend:
            <<: *limiter
            limit: 3
            interval: '15 minutes'
        invitation_resend:
            <<: *limiter
            limit: 3
            interval: '1 hour'
        invitation_resend_team:
            <<: *limiter
            limit: 30
            interval: '1 hour'
        login_account_ip:
            <<: *limiter
            limit: 5
            interval: '15 minutes'
        login_ip:
            <<: *limiter
            limit: 50
            interval: '15 minutes'
