security:
    password_hashers:
        Identity\Infrastructure\Security\SecurityUser:
            algorithm: argon2id

    providers:
        accounts:
            id: Identity\Infrastructure\Security\SecurityUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Signed agent API (protocol v1): no session, no CSRF, no redirect. The enrollment is public (proof of
        # possession checked by EnrollAgent); every other request is authenticated by its signature.
        agent:
            pattern: ^/agent/v1/
            stateless: true
            custom_authenticators:
                - Fleet\Infrastructure\Security\AgentRequestAuthenticator
            entry_point: Fleet\Infrastructure\Security\AgentRequestAuthenticator
        main:
            lazy: true
            provider: accounts
            user_checker: Identity\Infrastructure\Security\AccountChecker
            # Signing in with a passkey (POST /login/passkey): no second factor after it (PasskeyToken).
            custom_authenticators:
                - Identity\Infrastructure\Security\PasskeyAuthenticator
            entry_point: form_login
            form_login:
                login_path: identity_login
                check_path: identity_login
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: shared_home
                # No client-supplied return URL (open redirect): the parameter name is never sent by our forms.
                target_path_parameter: _depverify_no_target_path
                use_referer: false
                failure_handler: Identity\Infrastructure\Security\LoginFailureHandler
            login_throttling:
                limiter: Identity\Infrastructure\Security\LoginRateLimiter
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                default_target_path: shared_home
                prepare_on_login: true
                prepare_on_access_denied: true
                enable_csrf: true
                csrf_token_id: two_factor
                trusted_parameter_name: _trusted
                failure_handler: Identity\Infrastructure\Security\TwoFactorFailureHandler
            logout:
                path: identity_logout
                target: identity_login
                enable_csrf: true
                csrf_token_id: logout
                clear_site_data: ['cache', 'cookies', 'storage']

    # Only the first matching rule applies.
    access_control:
        - { path: ^/_healthcheck$, roles: PUBLIC_ACCESS }
        - { path: ^/agent/v1/enrollments$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/agent/v1/, roles: ROLE_AGENT }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/login/passkey(/options)?$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/password/forgot$, roles: PUBLIC_ACCESS }
        - { path: ^/password/reset/new$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: '^/password/reset/[A-Za-z0-9_-]{43}$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/invitations/[A-Za-z0-9_-]{43}$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/email/confirm/[A-Za-z0-9_-]{43}$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/email/confirm$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/invitations/pending$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/notifications/unsubscribe$, roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/install\.sh$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/downloads/agent/[^/]+/(depverify-agent-[a-z0-9_]+-linux|SHA256SUMS(\.minisig)?)$', roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: '^/notifications/confirm/[A-Za-z0-9_-]{43}$', roles: PUBLIC_ACCESS, methods: [GET, POST] }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # One role only: several roles in a rule mean "any of them". ROLE_SUPER_ADMIN exists on a fully
        # authenticated token only (a second factor in progress has no role).
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Identity\Infrastructure\Security\SecurityUser:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
