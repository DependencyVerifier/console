---
# A fixed project name: two checkouts both named `console` would otherwise share the Compose project `console` and
# replace each other's containers. Volumes are prefixed with it (depverifier-console_database_data…).
name: depverifier-console

services:
  php:
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-console.depverify.localhost}, php:80
      DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME:-console.depverify.localhost}:${HTTPS_PORT:-443}}
      # Runtime role only (no DDL, append-only audit). The owner's credentials never reach the web workers:
      # they are passed to CLI commands by the Makefile (see .docker/database/owner.env.dist).
      DATABASE_URL: postgresql://depverify_app:${DEPVERIFY_APP_PASSWORD:-!ChangeMeApp!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
    # Readiness = the application's own /_healthcheck (checks the database), not only Caddy being up.
    # Requested over the internal "php:80" address listed in SERVER_NAME. Never weaken it to make a deploy pass.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(false === @file_get_contents('http://php/_healthcheck', context: stream_context_create(['http' => ['timeout' => 5]])) ? 1 : 0);"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # The verified agent releases: stored by the cron's daily sync, served by php (install.sh, downloads). One volume
      # shared by both, or what the cron stores never reaches the web, and kept across deploys.
      - agent_releases:/app/var/agent-releases
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  # The scheduled commands (frankenphp/crontab): the cron daemon runs as root and starts each job as www-data, with
  # the runtime role, like php and the worker. `docker compose logs cron` shows their output.
  cron:
    restart: unless-stopped
    user: root
    command: ["docker-cron"]
    volumes:
      - agent_releases:/app/var/agent-releases
    environment:
      DATABASE_URL: postgresql://depverify_app:${DEPVERIFY_APP_PASSWORD:-!ChangeMeApp!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
    depends_on:
      - database
    healthcheck:
      disable: true

  # Messenger worker of the async queues (ingest first): the same image and runtime role as php, no web server.
  # It stops every hour (or at 256 MB) and Compose restarts it, so a deploy or a leak never lasts.
  worker:
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "ingest", "matching", "feeds", "notifications", "--time-limit=3600", "--memory-limit=256M"]
    environment:
      DATABASE_URL: postgresql://depverify_app:${DEPVERIFY_APP_PASSWORD:-!ChangeMeApp!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
    depends_on:
      - database
    healthcheck:
      disable: true

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # Passwords of the application roles created by .docker/database/roles.sh.
      DEPVERIFY_APP_PASSWORD: ${DEPVERIFY_APP_PASSWORD:-!ChangeMeApp!}
      DEPVERIFY_OWNER_PASSWORD: ${DEPVERIFY_OWNER_PASSWORD:-!ChangeMeOwner!}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<major>/ : mount the parent directory.
      - database_data:/var/lib/postgresql:rw
      # Creates depverify_owner / depverify_app on a fresh volume (`make db-roles` for an existing one).
      - ./.docker/database/roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
  agent_releases:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
