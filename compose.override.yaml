---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      # Restart workers on code changes, and when Vite rewrites entrypoints.json (dev server start, `yarn build`):
      # the Reprise bundle keeps it in memory, so a stale worker would point at old asset URLs.
      FRANKENPHP_WORKER_CONFIG: |-
        watch ./**/*.{env,php,twig,yaml,yml}
        watch ./public/build/entrypoints.json
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  cron:
    image: ${IMAGES_PREFIX:-}app-php-dev
    volumes:
      - ./:/app
      - /app/var
    environment:
      XDEBUG_MODE: "off"
      APP_ENV: "${APP_ENV:-dev}"

  # The worker does not reload code: `make worker-restart` after a change to a message handler.
  worker:
    image: ${IMAGES_PREFIX:-}app-php-dev
    volumes:
      - ./:/app
      - /app/var
    environment:
      XDEBUG_MODE: "off"
      APP_ENV: "${APP_ENV:-dev}"

  # Front-end toolchain (Symfony Reprise + Vite). Run every JS command through it:
  #   docker compose exec node yarn add -D <package>
  node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    command: ["sh", "-c", "corepack enable && yarn install && yarn dev --host 0.0.0.0"]
    # package.json links the Symfony UX packages from vendor/ (file:vendor/symfony/ux-*/assets): wait until
    # the php container is healthy, i.e. its entrypoint has installed the Composer vendors.
    depends_on:
      php:
        condition: service_healthy
    # Healthy once Vite answers, i.e. after `yarn install`: `docker compose up --wait` (CI, make up) then
    # guarantees node_modules exists before typecheck or build run.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/build/@vite/client"]
      start_period: 180s
      interval: 5s
      timeout: 5s
      retries: 6
    ports:
      - "5173:5173"

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
    # Dump / restore scripts used by `make db-dump` and `make db-import`.
    volumes:
      - ./.docker/database/scripts/reset:/usr/local/bin/reset:ro
      - ./.docker/database/scripts/save:/usr/local/bin/save:ro
###< doctrine/doctrine-bundle ###

  # Web UI for the dev database (PostgreSQL equivalent of phpMyAdmin). Bound to localhost only.
  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - database

  # Dev mail catcher (decision 27): SMTP on mailpit:1025 inside the Docker network only, web UI on
  # http://localhost:8025. Pinned by tag and digest.
  mailpit:
    image: axllent/mailpit:v1.29@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
