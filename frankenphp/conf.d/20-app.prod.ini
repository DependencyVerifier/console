; https://symfony.com/doc/current/performance.html#use-the-opcache-class-preloading
opcache.preload_user = www-data
opcache.preload = /app/config/preload.php
; https://symfony.com/doc/current/performance.html#don-t-check-php-files-timestamps
opcache.validate_timestamps = 0
; Above the worker's own limit (messenger:consume --memory-limit=256M in compose.yaml), so that it stops cleanly
; before PHP kills it; an inventory or a sync of advisories needs more than the default 128M.
memory_limit = 512M
