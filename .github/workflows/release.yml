name: Release

# A tag vX.Y.Z publishes the production image of the console, ghcr.io/dependencyverifier/console, for amd64 and arm64,
# so that no server has to build it (INSTALL.md). In order, and nothing readable is tagged before the end:
#   build    the image, pushed by digest only (no tag), with provenance and SBOM;
#   smoke    that digest starts on both platforms;
#   publish  sign it (cosign keyless), verify the signature, tag it X.Y.Z, then latest when X.Y.Z is higher than the
#            version of the signed image latest designates;
#   release-notes  only when latest designates this image (read again right before writing): the GitHub Release
#            vX.Y.Z, notes from the CHANGELOG.md section `## X.Y.Z`, marked Latest. The update banner of the consoles
#            reads releases/latest, so it never announces an image that is not signed and tagged latest.
# bin/install-console verifies the signature against this workflow and the tag:
#   cosign verify ghcr.io/dependencyverifier/console@sha256:<digest>
#     --certificate-identity 'https://github.com/DependencyVerifier/console/.github/workflows/release.yml@refs/tags/vX.Y.Z'
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# A failed run tags and signs nothing: fix it on main and release a higher version, never move a published tag. Only
# release-notes may fail after the publication: re-run it (it creates the Release only while latest is still this
# image). Never create a Release by hand: it could announce an image that does not exist.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dependencyverifier/console

jobs:
  build:
    name: Build and push by digest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # Only a vX.Y.Z tag (bin/lib/release.sh, RELEASE_TAG_REGEXP) on a commit of main makes a release.
      - name: Check the tag
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          . bin/lib/release.sh
          is_release_tag "$TAG" || { echo "::error::$TAG is not a release tag (vX.Y.Z)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          changelog_section "${TAG#v}" > /dev/null \
            || { echo "::error::CHANGELOG.md has no section ## ${TAG#v} (rename ## Unreleased before tagging)"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The token stays on the runner: never passed to the build (no --secret, no Actions cache). The only build
      # argument is the version, public (the tag, the label, the provenance).
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build and push by digest
        id: build
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          docker buildx build \
            --target frankenphp_prod \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=$VERSION" \
            --build-arg "APP_VERSION=$VERSION" \
            --provenance=mode=max --sbom=true \
            --output "type=image,name=$IMAGE,push-by-digest=true,push=true" \
            --metadata-file metadata.json \
            .
          digest=$(grep -oE '"containerimage.digest": *"sha256:[0-9a-f]{64}"' metadata.json | grep -oE 'sha256:[0-9a-f]{64}')
          [ -n "$digest" ] || { echo '::error::no image digest in metadata.json'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # Throwaway values, no database: the kernel boots and the console answers (the entrypoint waits for a database,
      # so it is bypassed).
      - name: The image starts
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ref="$IMAGE@$DIGEST"
          docker pull --platform "$PLATFORM" "$ref"
          # Read in the registry, for this platform: a local `docker inspect` of a multi-platform reference reads the
          # runner's own platform, not the emulated one.
          label=$(docker buildx imagetools inspect "$ref" \
            --format "{{ index (index .Image \"$PLATFORM\").Config.Labels \"org.opencontainers.image.version\" }}")
          [ "$label" = "$VERSION" ] || { echo "::error::version label $label, expected $VERSION"; exit 1; }
          # APP_VERSION (the update banner) twice: as written in the registry for this platform, then as the console
          # reads it at runtime on this platform.
          docker buildx imagetools inspect "$ref" --format "{{ json (index .Image \"$PLATFORM\").Config.Env }}" \
            | grep -qF "\"APP_VERSION=$VERSION\"" || { echo "::error::APP_VERSION is not $VERSION in the image config"; exit 1; }
          env_version=$(docker run --rm --platform "$PLATFORM" --entrypoint printenv "$ref" APP_VERSION)
          [ "$env_version" = "$VERSION" ] || { echo "::error::APP_VERSION $env_version, expected $VERSION"; exit 1; }
          run() {
            docker run --rm --platform "$PLATFORM" --entrypoint php \
              -e APP_SECRET="$(openssl rand -hex 32)" \
              -e APP_ENCRYPTION_KEYS="key1=$(openssl rand -base64 32)" \
              -e APP_HASH_PEPPER="key1=$(openssl rand -base64 32)" \
              -e APP_AGENT_SIGNING_KEY="$(openssl rand -base64 32)" \
              -e DATABASE_URL='postgresql://smoke:smoke@127.0.0.1:1/smoke?serverVersion=18&charset=utf8' \
              -e MAILER_DSN='null://null' -e MAILER_FROM='smoke@example.org' \
              "$ref" bin/console "$@"
          }
          run --version
          run about

  publish:
    name: Sign and tag
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      latest_is_this: ${{ steps.tag.outputs.latest_is_this }}
    # One publication at a time, never cancelled: latest is compared and moved by a single run.
    concurrency:
      group: console-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Sign and verify
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          . bin/lib/release.sh
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$(release_identity "$VERSION")" \
            --certificate-oidc-issuer "$SIGSTORE_ISSUER" > /dev/null

      - name: Tag X.Y.Z, and latest when it is the highest version
        id: tag
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          . bin/lib/release.sh
          tag_as() {
            docker buildx imagetools create --tag "$IMAGE:$1" "$IMAGE@$DIGEST"
            resolved=$(docker buildx imagetools inspect "$IMAGE:$1" --format '{{.Manifest.Digest}}')
            [ "$resolved" = "$DIGEST" ] || { echo "::error::$IMAGE:$1 resolves to $resolved, not $DIGEST"; exit 1; }
          }
          tag_as "$VERSION"

          # The version latest designates: only a signed release counts (an invalid signature stops here, loudly).
          current=''
          if latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}' 2> /dev/null); then
            cosign verify "$IMAGE@$latest" --certificate-identity-regexp "$RELEASE_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$SIGSTORE_ISSUER" > /dev/null
            current=$(docker buildx imagetools inspect "$IMAGE@$latest" \
              --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.version" }}')
          fi
          if [ -z "$current" ] || version_lt "$current" "$VERSION"; then
            tag_as latest
            echo "latest: $VERSION (was ${current:-none})"
          else
            echo "latest stays $current ($VERSION is not higher)"
          fi
          echo "Published $IMAGE:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          # A hint only, to skip release-notes for nothing: a re-run reuses this output, so release-notes reads the
          # state again before writing anything.
          resolved=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          if [ "$resolved" = "$DIGEST" ]; then
            echo 'latest_is_this=true' >> "$GITHUB_OUTPUT"
          else
            echo 'latest_is_this=false' >> "$GITHUB_OUTPUT"
          fi

  # The GitHub Release read by the update banner. contents: write and nothing else: no id-token, no packages, no
  # third-party action (docker buildx and gh are the ones of the runner: never add a setup-* action to this job). The
  # anonymous read of latest needs the GHCR package to be public (else this job fails closed). A short window remains
  # between that read and the creation (accepted: it heals with the next release). Its own concurrency group, never
  # console-publish (a pending job of a shared group is cancelled by a newer one): if a job waiting here was cancelled,
  # re-run release-notes of the version latest designates. The token is given to the last step only.
  release-notes:
    name: GitHub Release
    needs: [build, publish]
    if: needs.publish.outputs.latest_is_this == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: console-release-notes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notes from the CHANGELOG
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          . bin/lib/release.sh
          changelog_section "$VERSION" > "$RUNNER_TEMP/notes.md"

      # The state is read again right before writing: a higher version may have taken latest in the meantime, and then
      # this version gets no Release (releases/latest never goes back).
      - name: Create the Release while latest is this image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          latest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          if [ "$latest" != "$DIGEST" ]; then
            echo "latest is no longer $VERSION: no Release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if existing=$(gh release view "v$VERSION" --json isDraft,isPrerelease,name 2> /dev/null); then
            echo "::warning::The Release v$VERSION already exists ($existing): left as is, check that it is final and Latest"
            exit 0
          fi
          gh release create "v$VERSION" --title "Console $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
          echo "Release v$VERSION created" >> "$GITHUB_STEP_SUMMARY"
